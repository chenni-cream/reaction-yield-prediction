name: lightweight-validation
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q feature_generation model_training scripts tests
      - run: python scripts/recalculate_final_metrics.py
      - run: python -m unittest discover -s tests -v
      - run: python -c "import json, pathlib; [json.load(open(p)) for p in pathlib.Path('notebooks').glob('*.ipynb')]"
